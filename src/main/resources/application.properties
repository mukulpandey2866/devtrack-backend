spring.application.name=devtrack-backend

# --- Server ---
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:25s}
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=64KB
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# --- Database (no defaults on purpose: startup fails if a variable is missing) ---
spring.datasource.url=${DB_JDBC_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=devtrack-pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:20000}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.data-source-properties.ApplicationName=devtrack-backend
spring.datasource.hikari.data-source-properties.connectTimeout=10
spring.datasource.hikari.data-source-properties.socketTimeout=60
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true

# --- JPA / Hibernate: schema is owned by Flyway, Hibernate only validates ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=${APP_TIME_ZONE:UTC}
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.jakarta.persistence.query.timeout=${DB_QUERY_TIMEOUT_MS:15000}

# --- Flyway ---
# An existing manually created database has no history table; Flyway refuses to touch it until
# it is baselined once (see docs/DATABASE_MIGRATIONS.md). Baselining is therefore opt-in.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing manually created schema
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# --- Web / pagination / validation limits ---
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- Security ---
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:devtrack-backend}
app.jwt.audience=${JWT_AUDIENCE:devtrack-frontend}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# --- OpenAPI (enabled only in the local profile) ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Actuator: only health is exposed ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.health.db.enabled=true

# --- Logging ---
logging.level.root=INFO
logging.level.com.devtrack=INFO
