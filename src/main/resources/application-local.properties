# Local development: optionally load variables from an untracked .env file (KEY=value lines, no quotes).
spring.config.import=optional:file:.env[.properties]

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
spring.jpa.show-sql=false
logging.level.com.devtrack=DEBUG
